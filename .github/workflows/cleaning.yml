name: HomeMatch Cleaning Pipeline

on:
  push:
    branches:
      - main
      - devops/cleaning-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cleaning/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cleaning/requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Clean accommodation dataset
        run: |
          python cleaning/clean_listings.py \
            --input "Data/Cleaned Data/listings_cleaned.csv" \
            --output cleaning_output

      - name: Build Docker image
        run: docker build -t homematch-cleaning .

      - name: Run cleaning inside Docker
        run: |
          mkdir -p docker_output
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }}/docker_output,target=/app/cleaning_output" \
            homematch-cleaning

      - name: Upload cleaning results
        uses: actions/upload-artifact@v7
        with:
          name: cleaning-results
          path: |
            cleaning_output/
            docker_output/
          if-no-files-found: error
          retention-days: 14